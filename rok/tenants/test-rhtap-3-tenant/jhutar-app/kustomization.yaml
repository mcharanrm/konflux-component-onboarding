apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
  # JSON patch
  - target:
      kind: Application 
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: jhutar-app 
      - op: replace
        path: /metadata/namespace
        value: test-rhtap-3-tenant
      - op: replace 
        path: /spec/displayName
        value: jhutar-app
  - target:
      kind: Component
      name: comp
    patch: |-
      - op: replace
        path: /metadata/name
        value: jhutar-comp      
      - op: replace
        path: /metadata/namespace
        value: test-rhtap-3-tenant
      - op: replace
        path: /spec/application
        value: jhutar-app
      - op: replace
        path: /spec/componentName
        value: jhutar-comp
      - op: replace
        path: /spec/source/git/dockerfileUrl
        value: Dockerfile
      - op: replace
        path: /spec/source/git/url
        value: https://github.com/jhutar/example-repo-3.git
      - op: replace
        path: /spec/source/git/revision
        value: main
  - target:
      kind: ReleasePlan
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: test-rhtap-3-tenant
      - op: replace
        path: /spec/application
        value: jhutar-app
  - target:
      kind: IntegrationTestScenario
    patch: |-
      - op: replace
        path: /metadata/name
        value: jhutar-app-its
      - op: replace
        path: /metadata/namespace
        value: test-rhtap-3-tenant
      - op: replace
        path: /spec/application
        value: jhutar-app

resources:
  - ../../../../create-konflux-manifests/overlays/container
