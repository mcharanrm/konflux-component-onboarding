---
- name: show the current iteration of the loop at the beginning
  ansible.builtin.debug:
    msg: "start creating build pipelines for {{ kflux_data.git_repo_name }}"

- name: extract source repo name
  ansible.builtin.set_fact:
    source_repo_name: "{{ source_git_repo | basename | split('.') | first }}"

- name: check whether source repo is already cloned
  ansible.builtin.stat:
    path: "../{{ git_workspace_dir }}/{{ source_repo_name }}"
  register: source_repo_status

- name: clone source repository
  ansible.builtin.git:
    repo: "{{ source_git_repo }}"
    dest: "../{{ git_workspace_dir }}/{{ source_repo_name }}"
    single_branch: true
    version: "{{ git_revision }}"
  when: not source_repo_status.stat.exists

- name: get details about the remote repository
  ansible.builtin.uri:
    url: "{{ gh_api.base_url + gh_api.get_repository.path }}/{{ kflux_data.git_repo_name }}"
    method: "{{ gh_api.get_repository.method }}"
    headers:
      accept: application/vnd.github+json
      Authorization: "Bearer {{ gh_pat.create_repositories }}"
    status_code: "{{ gh_api.get_repository.expected_status | int }}"
  ignore_errors: true
  retries: "{{ gh_api.retries }}"
  delay: "{{ gh_api.delay_seconds }}"
  until: (get_repository_response.status | int) == (gh_api.get_repository.expected_status | int)
  register: get_repository_response

- name: Debug repository response
  debug:
    var: get_repository_response
    verbosity: 1

- name: Create .tekton directory for pipeline files
  ansible.builtin.file:
    path: "../{{ git_workspace_dir }}/{{ source_repo_name }}/.tekton"
    state: directory

- name: Retrieve the latest commit hash from rpmbuild-pipeline main
  ansible.builtin.shell: |
    git ls-remote {{ rpmbuild_pipeline_url }} refs/heads/main | awk '{print $1}'
  register: git_ls_remote_command_status

- name: Set commit hash to use in the build pipelines for revision parameter
  ansible.builtin.set_fact:
    rpmbuild_pipeline_latest_revision: "{{ git_ls_remote_command_status.stdout }}"

- name: render build pipeline templates
  ansible.builtin.template:
    src: ../create-build-pipelines/templates/{{ component_overlay }}/build-pipeline.yaml.j2
    dest: "../{{ git_workspace_dir }}/{{ source_repo_name }}/.tekton/{{ kflux_data.git_repo_name }}-pull-request.yaml"

- name: create feature branch and commit changes
  ansible.builtin.shell: |
    cd ../{{ git_workspace_dir }}/{{ source_repo_name }}
    git remote remove {{ kflux_data.git_repo_name }} || true
    git remote add {{ kflux_data.git_repo_name }} {{ get_repository_response.json.ssh_url }}
    git branch -D konflux-{{ kflux_data.git_repo_name }} || true
    git push {{ kflux_data.git_repo_name }} --delete konflux-{{ kflux_data.git_repo_name }} || true
    git checkout -b konflux-{{ kflux_data.git_repo_name }}
    git add .tekton/
    git commit -m "Add tekton build pipelines"
    git push -u {{ kflux_data.git_repo_name }} konflux-{{ kflux_data.git_repo_name }}
    git checkout {{ git_revision }}

- name: open GitHub pull request
  ansible.builtin.uri:
    url: "{{ gh_api.base_url }}{{ gh_api.create_pull_request.path }}/{{ kflux_data.git_repo_name }}/pulls"
    method: "{{ gh_api.create_pull_request.method }}"
    headers:
      accept: application/vnd.github+json
      Authorization: "Bearer {{ gh_pat.create_repositories }}"
    body_format: json
    body: >
      {
        "head": "konflux-{{ kflux_data.git_repo_name }}",
        "base": "{{ git_revision }}",
        "title": "Add Tekton build pipelines for {{ kflux_data.knflux_comp_name }}"
      }
    status_code: "{{ gh_api.create_pull_request.expected_status | int }}"
  ignore_errors: true
  retries: "{{ gh_api.retries }}"
  delay: "{{ gh_api.delay_seconds }}"
  until: (create_pull_request_response.status | int) == (gh_api.create_pull_request.expected_status | int)
  register: create_pull_request_response

- name: show the iteration of the loop at the end
  ansible.builtin.debug:
    msg: "successfully created build pipelines for {{ kflux_data.git_repo_name }}"
