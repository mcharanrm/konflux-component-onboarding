---
- name: show the current iteration of the loop at the beginning
  ansible.builtin.debug:
    msg: "start triggering push build for {{ kflux_data.git_repo_name }}"

- name: get details about the remote repository
  ansible.builtin.uri:
    url: "{{ gh_api.base_url + gh_api.get_repository.path }}/{{ kflux_data.git_repo_name }}"
    method: "{{ gh_api.get_repository.method }}"
    headers:
      accept: application/vnd.github+json
      Authorization: "Bearer {{ gh_pat.create_repositories }}"
    status_code: "{{ gh_api.get_repository.expected_status | int }}"
  ignore_errors: true
  retries: "{{ gh_api.retries }}"
  delay: "{{ gh_api.delay_seconds }}"
  until: (get_repository_response.status | int) == (gh_api.get_repository.expected_status | int)
  register: get_repository_response

- name: prepare pristine workspace
  ansible.builtin.shell: |
    set -ex
    cd ../{{ git_workspace_dir }}/{{ source_repo_name }}
    # Setup target remote
    git remote remove {{ kflux_data.git_repo_name }} || true
    git remote add {{ kflux_data.git_repo_name }} {{ get_repository_response.json.ssh_url }}
    # Pull latest commits from target repo
    git fetch {{ kflux_data.git_repo_name }} {{ git_revision }}
    # Removes all untracked files/folders
    git clean -fd
    # Move local HEAD to match target remote main branch
    git reset --hard {{ kflux_data.git_repo_name }}/{{ git_revision }}
    git checkout {{ git_revision }}

- name: commit insignificant change and push to main
  ansible.builtin.shell: |
    set -ex
    cd ../{{ git_workspace_dir }}/{{ source_repo_name }}
    date --utc -Ins >> README.md
    git add README.md
    git commit -m "Trigger on-push build"
    git push {{ kflux_data.git_repo_name }} {{ git_revision }}

- name: show the iteration of the loop at the end
  ansible.builtin.debug:
    msg: "successfully triggered push build for {{ kflux_data.git_repo_name }}"
